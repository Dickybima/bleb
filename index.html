<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Icons are versioned (?v=) so browsers drop the cached FOZO icon. -->
    <link rel="icon" href="/zeon-icon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png?v=2" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png?v=2" type="image/png" sizes="16x16" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <script>
      // Apply the saved theme (dark by default) before first paint to avoid a flash.
      try { if (localStorage.getItem("zeon:theme") !== "light") document.documentElement.classList.add("dark"); }
      catch (e) { document.documentElement.classList.add("dark"); }
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZEON" />
    <meta property="og:title" content="ZEON · Fame, made liquid" />
    <meta property="og:description" content="Turn any Zora profile into a live token on Robinhood Chain." />
    <meta property="og:image" content="%SITE_URL%/og-image.png?v=3" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZEON · Fame, made liquid" />
    <meta name="twitter:description" content="Turn any Zora profile into a live token on Robinhood Chain." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png?v=3" />
    <title>ZEON · Fame, made liquid</title>
    <meta name="description" content="ZEON turns any Zora profile into a live token on Robinhood Chain. Born on a bonding curve, priced by belief." />
  </head>
  <body>
    <div id="root"></div>
    <!-- Shown only if the app script never starts (e.g. it failed to download or crashed before React mounted). -->
    <div id="boot-fallback" hidden style="max-width:480px;margin:96px auto;padding:24px;font-family:system-ui,sans-serif;text-align:center;color:#888">
      <p style="font-size:18px;font-weight:600;color:inherit">ZEON didn't load.</p>
      <p>Check your connection and reload. Still blank? Try briefly disabling any wallet extension that might be clashing.</p>
      <button onclick="location.reload()" style="padding:10px 20px;border-radius:999px;border:0;background:#5b7cff;color:#fff;font:inherit;font-weight:600;cursor:pointer">Reload</button>
    </div>
    <script>
      setTimeout(function () {
        var root = document.getElementById("root");
        if (!window.__launchpadMounted || !root || !root.childElementCount) document.getElementById("boot-fallback").hidden = false;
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
